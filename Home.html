<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Picverse Community - Home</title>
        <!-- FavIcon -->
        <link rel="icon" href="CSS/Image/logo/Picverse Logo.png" type="image/png">
        <!-- G Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <!-- Feather Icons -->
        <script src="https://unpkg.com/feather-icons"></script>
        <!-- CSS -->
        <link rel="stylesheet" href="CSS/NavBar.css">
        <link rel="stylesheet" href="CSS/Home.css">
    </head>
    <body>
        <!--NavBar-->
        <header>
            <nav class="nav-bar">
                <a href="Home.html" class="logo"><img src="CSS/Image/logo/Picverse Logo with Text.png" width="168px" height="52px" alt=""></a>
                <div class="vertical-line"></div>
                <div class="nav-bar-menu">
                    <a href="#Signup" class="signup-button-menu">Sign Up</a>
                    <a href="#Login" class="login-button-menu">Log In</a>
                    <a href="Home.html" class="home-button">HOME</a>
                    <a href="Create.html" class="create-button">CREATE</a>
                    <a href="Gallery.html" class="gallery-button">GALLERY</a>
                    <a href="Community.html" class="community-button">COMMUNITY</a>
                    <a href="AboutUs.html" class="aboutus-button">ABOUT US</a>
                </div>
                <div class="nav-bar-extra">        
                    <a href="#Signup" class="signup-button">Sign Up</a>
                    <a href="#Login" class="login-button">Log In</a>
                    <a href="#" id="hamburger-menu"><i data-feather="menu"></i></a>
                </div>
            </nav>
        </header>
        
        <!--Hero Section-->
        
        <section class="hero" id="home">
            <h1>Creative Community for World Creators</h1>
            <div class="hero-slideshow">
                <i data-feather="arrow-left" id="left-arrow"></i>
                <div class="hero-slideshow-item">
                    <img src="./CSS/Image/doodle/Cat.avif" alt="" >
                    <p class="item-name">Doodle Cat</p>
                    <p class="creator">By <span class="creator-name">ExWhyZed</span></p>
                </div>
                <div class="hero-slideshow-item">
                    <img src="./CSS/Image/opepen/Black n white opepen.avif" alt="">
                    <p class="item-name">Black and White Opepen</p>
                    <p class="creator">By <span class="creator-name">ExWhyZed</span></p>
                </div>
                <div class="hero-slideshow-item">
                    <img src="./CSS/Image/doodle/Fire.avif" alt="">
                    <p class="item-name">Doodle Fire</p>
                    <p class="creator">By <span class="creator-name">ExWhyZed</span></p>
                </div>
                <div class="hero-slideshow-item">
                    <img src="./CSS/Image/Penguin/King pengu.avif" alt="">
                    <p class="item-name">King Pengu</p>
                    <p class="creator">By <span class="creator-name">ExWhyZed</span></p>
                </div>
                <i data-feather="arrow-right" id="right-arrow"></i>
            </div>
            <div class="hero-button">
                <a href="Gallery.html" class="button">Browse Our Gallery</a>
            </div>
        </section>
        

        <!-- Feather Icons -->
        <script>feather.replace();</script>

        <!-- JavaScript -->
         <script src="JS/Home.js"></script>
    </body>
</html>
